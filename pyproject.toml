[project]
name = "tickmark"
version = "0.2.0"
description = "Spreadsheet auditor — finds inconsistent formulas, hardcoded constants, broken links and silent errors in Excel workbooks."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tickmark contributors" }]
keywords = ["excel", "xlsx", "audit", "spreadsheet", "formula"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

# openpyxl is the only hard dependency: it provides both OOXML reading and the
# formula tokenizer (T3). See 04-tickmark.md section 9.
dependencies = [
    "openpyxl>=3.1.5",
    # Legacy .xls only. xlrd 2.x dropped .xlsx deliberately, which is exactly
    # the split we want: openpyxl owns OOXML, xlrd owns BIFF, neither guesses.
    # olefile reads the OLE container the BIFF stream lives in.
    "xlrd>=2.0.1",
    "olefile>=0.47",
    # The local-server GUI (NF 2, item 12). A hard dependency rather than an
    # extra because the product ships both entry points in one installer — but
    # the engine must never import it. See tests/test_layering.py, which fails
    # the build if anything under workbook/, formula/, graph/, checks/ or
    # report/ grows a web dependency: the CLI has to work with no server.
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[project.scripts]
tickmark = "tickmark.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    # Writes .xls, so most legacy fixtures can be built at test time and stay
    # readable in the diff like every other fixture. It cannot produce shared
    # formulas or cached values, which is why one Excel-authored binary is
    # committed alongside — see tests/fixtures/.
    "xlwt>=1.3",
    # Drives the FastAPI app in-process, so the server is tested without a
    # browser or a real socket (05-architecture.md, integration tests).
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
