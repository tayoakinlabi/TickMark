[project]
name = "tickmark"
version = "0.1.0"
description = "Spreadsheet auditor — finds inconsistent formulas, hardcoded constants, broken links and silent errors in Excel workbooks."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Tickmark contributors" }]
keywords = ["excel", "xlsx", "audit", "spreadsheet", "formula"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

# openpyxl is the only hard dependency: it provides both OOXML reading and the
# formula tokenizer (T3). See 04-tickmark.md section 9.
dependencies = [
    "openpyxl>=3.1.5",
    # Legacy .xls only. xlrd 2.x dropped .xlsx deliberately, which is exactly
    # the split we want: openpyxl owns OOXML, xlrd owns BIFF, neither guesses.
    # olefile reads the OLE container the BIFF stream lives in.
    "xlrd>=2.0.1",
    "olefile>=0.47",
]

# No optional extras. A 'server' extra pulling FastAPI and uvicorn was declared
# here before the local-server UI (item 12) existed; installing two dependencies
# that nothing imports is a promise the package does not keep. It comes back with
# the code that needs it.

[project.scripts]
tickmark = "tickmark.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    # Writes .xls, so most legacy fixtures can be built at test time and stay
    # readable in the diff like every other fixture. It cannot produce shared
    # formulas or cached values, which is why one Excel-authored binary is
    # committed alongside — see tests/fixtures/.
    "xlwt>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tickmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
